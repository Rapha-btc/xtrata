<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Synth</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 1000px; }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script type="module">
        (async () => {
            const t = new URLSearchParams(location.search).get('t') || String(Date.now());
            const cacheToken = encodeURIComponent(t);
            const standaloneParam = (new URLSearchParams(location.search).get('standalone') || '').trim().toLowerCase();
            const standalone =
                standaloneParam === '1' ||
                standaloneParam === 'true' ||
                standaloneParam === 'yes' ||
                window.parent === window;

            const [{ runPatch }, { BVST }] = await Promise.all([
                import(`../../../System/shared/patch_runtime.js?t=${cacheToken}`),
                import(`../../../System/shared/plugin_core.js?t=${cacheToken}`)
            ]);

            const resumeStandaloneAudio = async () => {
                try {
                    if (BVST.audioContext && BVST.audioContext.state === 'suspended') {
                        await BVST.audioContext.resume();
                    }
                } catch (_) {}

                try {
                    if (BVST.standaloneBridge && typeof BVST.standaloneBridge.resume === 'function') {
                        await BVST.standaloneBridge.resume();
                    }
                } catch (_) {}
            };

            const installStandaloneGuards = () => {
                if (!standalone) return;

                const appRoot = document.getElementById('bvst-app-root');
                const powerButton = document.getElementById('btn-power');
                const playButton = document.getElementById('btn-play');
                if (!appRoot || !powerButton) return;

                let powerLatched = false;
                let unlockArmed = true;

                const syncPowerVisual = () => {
                    powerButton.dataset.value = powerLatched ? '1' : '0';
                    powerButton.dataset.val = powerLatched ? '1' : '0';
                    powerButton.classList.toggle('active', powerLatched);
                    powerButton.setAttribute('aria-pressed', powerLatched ? 'true' : 'false');
                };

                const unlockAudio = () => {
                    void resumeStandaloneAudio();
                    if (!powerLatched) {
                        powerLatched = true;
                        syncPowerVisual();
                    }
                };

                const gestureUnlock = (event) => {
                    if (event && event.target && typeof event.target.closest === 'function' && event.target.closest('#btn-power')) {
                        return;
                    }
                    if (!unlockArmed) return;
                    unlockArmed = false;
                    unlockAudio();
                };

                powerButton.addEventListener('click', () => {
                    powerLatched = !powerLatched;
                    if (powerLatched) {
                        unlockArmed = false;
                        unlockAudio();
                    } else {
                        syncPowerVisual();
                    }
                });

                if (playButton) {
                    playButton.addEventListener('pointerdown', gestureUnlock, { capture: true });
                    playButton.addEventListener('click', unlockAudio);
                }

                appRoot.addEventListener('pointerdown', gestureUnlock, { capture: true });
                window.addEventListener('keydown', gestureUnlock, { capture: true });

                const powerObserver = new MutationObserver(() => {
                    if (powerLatched && !powerButton.classList.contains('active')) {
                        syncPowerVisual();
                    }
                });
                powerObserver.observe(powerButton, {
                    attributes: true,
                    attributeFilter: ['class', 'data-value', 'data-val']
                });

                syncPowerVisual();
            };

            await runPatch({
                patchUrl: `./patch.json?t=${cacheToken}`,
                containerId: 'app-container'
            });

            installStandaloneGuards();
        })();
    </script>
</body>
</html>
