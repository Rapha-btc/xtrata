<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtrata Runtime</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c1020;
        color: #e8ecff;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, sans-serif;
      }
      .runtime-shell {
        width: min(92vw, 640px);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #33406f;
        background: linear-gradient(180deg, #121938, #0e142b);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      }
      .runtime-shell h1 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }
      .runtime-shell p {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .runtime-shell code {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .runtime-shell .error {
        margin-top: 12px;
        color: #ffb4b4;
      }
      .runtime-shell .detail {
        margin-top: 8px;
        color: #c7d2ff;
      }
    </style>
  </head>
  <body>
    <div class="runtime-shell" id="runtime-shell">
      <h1>Launching runtime...</h1>
      <p id="runtime-status">Preparing isolated page context.</p>
    </div>

    <script>
      (function () {
        var shell = document.getElementById('runtime-shell');
        var statusEl = document.getElementById('runtime-status');

        function setStatus(message) {
          if (statusEl) {
            statusEl.textContent = message;
          }
        }

        function logRuntime(level, message, payload) {
          try {
            var logger =
              console && typeof console[level] === 'function'
                ? console[level].bind(console)
                : console.log.bind(console);
            if (payload !== undefined) {
              logger('[xtrata:runtime] ' + message, payload);
            } else {
              logger('[xtrata:runtime] ' + message);
            }
          } catch (error) {}
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function setError(message, detail) {
          logRuntime('warn', message || 'Runtime launch failed', {
            detail: detail || null
          });
          if (!shell) {
            return;
          }
          shell.innerHTML =
            '<h1>Runtime launch failed</h1>' +
            '<p class="error">' +
            escapeHtml(message || 'Unable to open runtime content.') +
            '</p>' +
            (detail
              ? '<p class="detail"><code>' + escapeHtml(detail) + '</code></p>'
              : '');
        }

        function toRuntimeEndpoint(params) {
          var url = new URL('/runtime/content', window.location.origin);
          if (params.contractId) {
            url.searchParams.set('contractId', params.contractId);
          }
          if (params.tokenId) {
            url.searchParams.set('tokenId', params.tokenId);
          }
          if (params.network) {
            url.searchParams.set('network', params.network);
          }
          if (params.fallbackContractId) {
            url.searchParams.set('fallbackContractId', params.fallbackContractId);
          }
          return url.toString();
        }

        function trimText(value) {
          return typeof value === 'string' ? value.trim() : '';
        }

        function parseRuntimeContractId(value) {
          var trimmed = trimText(value);
          if (!trimmed) {
            return null;
          }
          var separator = trimmed.indexOf('.');
          if (separator <= 0 || separator >= trimmed.length - 1) {
            return null;
          }
          return {
            address: trimmed.slice(0, separator),
            contractName: trimmed.slice(separator + 1)
          };
        }

        function normalizeRuntimeTokenUriPath(value) {
          var trimmed = trimText(value);
          if (!trimmed || /^\/\//.test(trimmed) || /^[a-z][a-z0-9+.-]*:/i.test(trimmed)) {
            return '';
          }
          var withoutHash = trimmed.split('#')[0] || trimmed;
          var withoutQuery = withoutHash.split('?')[0] || withoutHash;
          var rawSegments = withoutQuery.split('/');
          var segments = [];
          for (var index = 0; index < rawSegments.length; index += 1) {
            var segment = rawSegments[index];
            if (!segment || segment === '.') {
              continue;
            }
            if (segment === '..') {
              return '';
            }
            segments.push(segment);
          }
          return segments.join('/');
        }

        function buildRuntimeModuleBaseFromTokenUri(params, tokenUri) {
          var contract = parseRuntimeContractId(params && params.contractId);
          var normalizedTokenUri = normalizeRuntimeTokenUriPath(tokenUri);
          var tokenId = trimText(params && params.tokenId);
          var network = trimText(params && params.network) || 'mainnet';
          if (!contract || !normalizedTokenUri || !tokenId) {
            return '';
          }
          var segments = normalizedTokenUri.split('/');
          segments.pop();
          var encodedPath = segments
            .filter(Boolean)
            .map(function (segment) {
              return encodeURIComponent(segment);
            })
            .join('/');
          var prefix =
            '/runtime/modules/' +
            encodeURIComponent(network) +
            '/' +
            encodeURIComponent(contract.address) +
            '/' +
            encodeURIComponent(contract.contractName) +
            '/' +
            encodeURIComponent(tokenId);
          return encodedPath ? prefix + '/' + encodedPath + '/' : prefix + '/';
        }

        function resolveRuntimeModuleBase(params, responseModuleBase, responseTokenUri) {
          var liveModuleBase = trimText(responseModuleBase);
          if (liveModuleBase) {
            return liveModuleBase;
          }
          var derivedModuleBase = buildRuntimeModuleBaseFromTokenUri(params, responseTokenUri);
          if (derivedModuleBase) {
            return derivedModuleBase;
          }
          return trimText(params && params.moduleBase);
        }

        function loadFromRuntimeEndpoint(params) {
          var endpoint = toRuntimeEndpoint(params);
          logRuntime('debug', 'Fetching runtime endpoint', {
            endpoint: endpoint,
            params: params
          });
          return fetch(endpoint, {
            method: 'GET',
            credentials: 'same-origin',
            redirect: 'follow'
          }).then(function (response) {
            if (!response.ok) {
              var error = new Error('Runtime endpoint returned HTTP ' + response.status + '.');
              error.runtimeEndpoint = endpoint;
              throw error;
            }
            return response.text().then(function (html) {
              var responseModuleBase =
                response.headers.get('X-Xtrata-Runtime-Module-Base') || '';
              var responseTokenUri =
                response.headers.get('X-Xtrata-Runtime-Token-Uri') || '';
              return {
                html: html,
                moduleBase: resolveRuntimeModuleBase(
                  params,
                  responseModuleBase,
                  responseTokenUri
                )
              };
            });
          }).catch(function (error) {
            if (error && !error.runtimeEndpoint) {
              error.runtimeEndpoint = endpoint;
            }
            throw error;
          });
        }

        function loadFromSource(source) {
          if (!source) {
            return Promise.reject(new Error('No source URL provided.'));
          }
          logRuntime('debug', 'Fetching source URL fallback', {
            source: source
          });
          return fetch(source, {
            method: 'GET',
            credentials: 'same-origin',
            redirect: 'follow'
          }).then(function (response) {
            if (!response.ok) {
              throw new Error('Source URL returned HTTP ' + response.status + '.');
            }
            return response.text();
          });
        }

        function escapeAttribute(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }

        function injectHeadPrefix(html, content) {
          if (!content) {
            return html;
          }
          var headMatch = html.match(/<head[^>]*>/i);
          if (headMatch && headMatch.index !== undefined) {
            var headInsertion = headMatch.index + headMatch[0].length;
            return (
              html.slice(0, headInsertion) +
              content +
              html.slice(headInsertion)
            );
          }
          var htmlMatch = html.match(/<html[^>]*>/i);
          if (htmlMatch && htmlMatch.index !== undefined) {
            var htmlInsertion = htmlMatch.index + htmlMatch[0].length;
            return (
              html.slice(0, htmlInsertion) +
              '<head>' +
              content +
              '</head>' +
              html.slice(htmlInsertion)
            );
          }
          var bodyMatch = html.match(/<body[^>]*>/i);
          if (bodyMatch && bodyMatch.index !== undefined) {
            return (
              html.slice(0, bodyMatch.index) +
              '<head>' +
              content +
              '</head>' +
              html.slice(bodyMatch.index)
            );
          }
          return '<head>' + content + '</head>' + html;
        }

        function buildRuntimeBaseTag(params) {
          if (!params || !params.moduleBase) {
            return '';
          }
          return (
            '<base href="' +
            escapeAttribute(params.moduleBase) +
            '">'
          );
        }

        function buildRuntimeWalletSupportScriptTag(params) {
          var url = new URL('/runtime/wallet-shim.js', window.location.origin);
          if (params && params.network) {
            url.searchParams.set('network', params.network);
          }
          try {
            var query = new URLSearchParams(window.location.search || '');
            if (query.get('debug') === '1' || query.get('arcadeDebug') === '1') {
              url.searchParams.set('debug', '1');
            }
          } catch (error) {}
          return (
            '<script src="' +
            escapeAttribute(url.toString()) +
            '"></' +
            'script>'
          );
        }

        function buildRuntimeDiagnosticsScriptTag() {
          var url = new URL('/runtime/diagnostics.js', window.location.origin);
          return (
            '<script data-xtrata-runtime-diagnostics="true" src="' +
            escapeAttribute(url.toString()) +
            '"></' +
            'script>'
          );
        }

        function buildRuntimeUrlSupportScriptTag() {
          var url = new URL('/runtime/url-support.js', window.location.origin);
          return (
            '<script data-xtrata-runtime-url-support="true" src="' +
            escapeAttribute(url.toString()) +
            '"></' +
            'script>'
          );
        }

        function buildRuntimeTelemetryScriptTag() {
          var url = new URL('/runtime/telemetry.js', window.location.origin);
          return (
            '<script data-xtrata-runtime-telemetry="true" src="' +
            escapeAttribute(url.toString()) +
            '"></' +
            'script>'
          );
        }

        function buildRuntimeModuleBootstrapScriptTag() {
          var url = new URL('/runtime/module-bootstrap.js', window.location.origin);
          return (
            '<script data-xtrata-runtime-module-bootstrap="true" src="' +
            escapeAttribute(url.toString()) +
            '"></' +
            'script>'
          );
        }

        function injectRuntimeSupport(html, params) {
          html = injectHeadPrefix(html, buildRuntimeBaseTag(params));
          var telemetryScript = buildRuntimeTelemetryScriptTag();
          if (telemetryScript) {
            html = injectHeadPrefix(html, '\n' + telemetryScript);
          }
          var urlSupportScript = buildRuntimeUrlSupportScriptTag();
          if (urlSupportScript) {
            html = injectHeadPrefix(html, '\n' + urlSupportScript);
          }
          var diagnosticsScript = buildRuntimeDiagnosticsScriptTag();
          if (diagnosticsScript) {
            html = injectHeadPrefix(html, '\n' + diagnosticsScript);
          }
          var moduleBootstrapScript = buildRuntimeModuleBootstrapScriptTag();
          if (moduleBootstrapScript) {
            html = injectHeadPrefix(html, '\n' + moduleBootstrapScript);
          }
          var supportScript = buildRuntimeWalletSupportScriptTag(params);
          if (!supportScript) {
            return html;
          }
          return injectHeadPrefix(html, '\n' + supportScript);
        }

        function launchHtml(html, contextLabel, runtimeModuleBase) {
          if (!html || !html.trim()) {
            throw new Error('Runtime content was empty (' + contextLabel + ').');
          }
          var launchParams =
            runtimeModuleBase
              ? Object.assign({}, params, { moduleBase: runtimeModuleBase })
              : params;
          var htmlWithSupport = injectRuntimeSupport(html, launchParams);
          document.open();
          document.write(htmlWithSupport);
          document.close();
        }

        var query = new URLSearchParams(window.location.search || '');
        var params = {
          contractId: query.get('contractId') || '',
          tokenId: query.get('tokenId') || '',
          network: query.get('network') || 'mainnet',
          fallbackContractId: query.get('fallbackContractId') || '',
          moduleBase: query.get('moduleBase') || '',
          source: query.get('source') || ''
        };

        if (!params.contractId || !params.tokenId) {
          if (!params.source) {
            setError('Missing runtime parameters.', 'contractId/tokenId not provided');
            return;
          }
        }

        setStatus('Loading inscription content from runtime endpoint...');
        logRuntime('debug', 'Runtime launcher params resolved', params);

        loadFromRuntimeEndpoint(params)
          .then(function (result) {
            launchHtml(result.html, 'runtime-endpoint', result.moduleBase);
          })
          .catch(function (runtimeError) {
            var runtimeMessage =
              runtimeError && runtimeError.message
                ? runtimeError.message
                : String(runtimeError);
            var runtimeEndpoint =
              runtimeError && runtimeError.runtimeEndpoint
                ? runtimeError.runtimeEndpoint
                : toRuntimeEndpoint(params);
            if (!params.source) {
              setError(
                'Runtime endpoint failed and no fallback source was provided.',
                runtimeMessage + ' | endpoint=' + runtimeEndpoint
              );
              return;
            }
            setStatus('Runtime endpoint failed, trying provided source URL...');
            loadFromSource(params.source)
              .then(function (html) {
                launchHtml(html, 'source-url');
              })
              .catch(function (sourceError) {
                var sourceMessage =
                  sourceError && sourceError.message
                    ? sourceError.message
                    : String(sourceError);
                setError(
                  'Unable to load runtime content.',
                  runtimeMessage +
                    ' | endpoint=' +
                    runtimeEndpoint +
                    ' | source=' +
                    params.source +
                    ' | ' +
                    sourceMessage
                );
              });
          });
      })();
    </script>
  </body>
</html>
