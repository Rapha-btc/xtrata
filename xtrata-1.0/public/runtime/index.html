<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtrata Runtime</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c1020;
        color: #e8ecff;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, sans-serif;
      }
      .runtime-shell {
        width: min(92vw, 640px);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #33406f;
        background: linear-gradient(180deg, #121938, #0e142b);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      }
      .runtime-shell h1 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }
      .runtime-shell p {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .runtime-shell code {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .runtime-shell .error {
        margin-top: 12px;
        color: #ffb4b4;
      }
      .runtime-shell .detail {
        margin-top: 8px;
        color: #c7d2ff;
      }
    </style>
  </head>
  <body>
    <div class="runtime-shell" id="runtime-shell">
      <h1>Launching runtime...</h1>
      <p id="runtime-status">Preparing isolated page context.</p>
    </div>

    <script>
      (function () {
        var shell = document.getElementById('runtime-shell');
        var statusEl = document.getElementById('runtime-status');

        function setStatus(message) {
          if (statusEl) {
            statusEl.textContent = message;
          }
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function setError(message, detail) {
          if (!shell) {
            return;
          }
          shell.innerHTML =
            '<h1>Runtime launch failed</h1>' +
            '<p class="error">' +
            escapeHtml(message || 'Unable to open runtime content.') +
            '</p>' +
            (detail
              ? '<p class="detail"><code>' + escapeHtml(detail) + '</code></p>'
              : '');
        }

        function toRuntimeEndpoint(params) {
          var url = new URL('/runtime/content', window.location.origin);
          if (params.contractId) {
            url.searchParams.set('contractId', params.contractId);
          }
          if (params.tokenId) {
            url.searchParams.set('tokenId', params.tokenId);
          }
          if (params.network) {
            url.searchParams.set('network', params.network);
          }
          if (params.fallbackContractId) {
            url.searchParams.set('fallbackContractId', params.fallbackContractId);
          }
          return url.toString();
        }

        function loadFromRuntimeEndpoint(params) {
          var endpoint = toRuntimeEndpoint(params);
          return fetch(endpoint, {
            method: 'GET',
            credentials: 'same-origin',
            redirect: 'follow'
          }).then(function (response) {
            if (!response.ok) {
              throw new Error('Runtime endpoint returned HTTP ' + response.status + '.');
            }
            return response.text();
          });
        }

        function loadFromSource(source) {
          if (!source) {
            return Promise.reject(new Error('No source URL provided.'));
          }
          return fetch(source, {
            method: 'GET',
            credentials: 'same-origin',
            redirect: 'follow'
          }).then(function (response) {
            if (!response.ok) {
              throw new Error('Source URL returned HTTP ' + response.status + '.');
            }
            return response.text();
          });
        }

        function buildRuntimeWalletSupportScript(params) {
          var targetNetwork = String(
            (params && params.network ? params.network : 'mainnet') || 'mainnet'
          )
            .toLowerCase()
            .trim();
          if (targetNetwork !== 'testnet') {
            targetNetwork = 'mainnet';
          }
          var debugEnabled = false;
          try {
            var debugQuery = new URLSearchParams(window.location.search || '');
            debugEnabled =
              debugQuery.get('debug') === '1' ||
              debugQuery.get('arcadeDebug') === '1';
          } catch (error) {}

          return (
            '<script>(function(){\n' +
            "  if (window.__xtrataRuntimeWalletShimInstalled) return;\n" +
            '  window.__xtrataRuntimeWalletShimInstalled = true;\n' +
            '  var TARGET_NETWORK = ' +
            JSON.stringify(targetNetwork) +
            ';\n' +
            "  var DEBUG_ENABLED = " +
            (debugEnabled ? 'true' : 'false') +
            ';\n' +
            "  var STORAGE_KEY = 'xtrata.runtime.wallet.session.v1';\n" +
            "  var CONNECT_URLS = ['https://cdn.jsdelivr.net/npm/@stacks/connect@7.10.2/dist/index.mjs','https://unpkg.com/@stacks/connect@7.10.2/dist/index.mjs'];\n" +
            '  var connectModulePromise = null;\n' +
            '  var connectInFlight = null;\n' +
            '  function debugLog(message, detail){\n' +
            '    if(!DEBUG_ENABLED || typeof console === "undefined") return;\n' +
            '    try{\n' +
            '      if(typeof detail === "undefined") console.info("[xtrata-runtime-wallet] " + message);\n' +
            '      else console.info("[xtrata-runtime-wallet] " + message, detail);\n' +
            '    }catch(error){}\n' +
            '  }\n' +
            '  function normalizeNetwork(value){\n' +
            '    if(!value) return null;\n' +
            '    var lower = String(value).toLowerCase();\n' +
            "    if(lower.indexOf('mainnet') >= 0 || lower === 'main') return 'mainnet';\n" +
            "    if(lower.indexOf('testnet') >= 0 || lower === 'test') return 'testnet';\n" +
            '    return null;\n' +
            '  }\n' +
            '  function inferNetworkFromAddress(address){\n' +
            "    if(typeof address !== 'string') return null;\n" +
            '    var prefix = address.slice(0, 2);\n' +
            "    if(prefix === 'SP' || prefix === 'SM') return 'mainnet';\n" +
            "    if(prefix === 'ST' || prefix === 'SN') return 'testnet';\n" +
            '    return null;\n' +
            '  }\n' +
            '  function looksLikeStacksAddress(value){\n' +
            "    if(typeof value !== 'string') return false;\n" +
            '    var trimmed = value.trim();\n' +
            '    if(trimmed.length < 20) return false;\n' +
            '    var prefix = trimmed.slice(0, 2);\n' +
            "    return prefix === 'SP' || prefix === 'SM' || prefix === 'ST' || prefix === 'SN';\n" +
            '  }\n' +
            '  function readStoredSession(){\n' +
            '    try{\n' +
            "      if(!window.localStorage) return null;\n" +
            '      var raw = window.localStorage.getItem(STORAGE_KEY);\n' +
            '      if(!raw) return null;\n' +
            '      var parsed = JSON.parse(raw);\n' +
            '      if(!parsed || !looksLikeStacksAddress(parsed.address)) return null;\n' +
            '      return {\n' +
            '        address: String(parsed.address).trim(),\n' +
            '        network: normalizeNetwork(parsed.network) || inferNetworkFromAddress(parsed.address) || TARGET_NETWORK\n' +
            '      };\n' +
            '    }catch(error){\n' +
            '      return null;\n' +
            '    }\n' +
            '  }\n' +
            '  function writeStoredSession(session){\n' +
            '    try{\n' +
            "      if(!window.localStorage) return;\n" +
            '      if(session && looksLikeStacksAddress(session.address)){\n' +
            '        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({\n' +
            '          address: String(session.address).trim(),\n' +
            '          network: normalizeNetwork(session.network) || inferNetworkFromAddress(session.address) || TARGET_NETWORK\n' +
            '        }));\n' +
            '        return;\n' +
            '      }\n' +
            '      window.localStorage.removeItem(STORAGE_KEY);\n' +
            '    }catch(error){}\n' +
            '  }\n' +
            '  function isRequestNotImplementedError(error){\n' +
            '    var message = error && error.message ? String(error.message) : String(error || "");\n' +
            '    var lower = message.toLowerCase();\n' +
            "    return lower.indexOf('request function is not implemented') >= 0;\n" +
            '  }\n' +
            '  function extractStacksAddress(payload, depth){\n' +
            '    if(depth > 8) return null;\n' +
            "    if(typeof payload === 'string' && looksLikeStacksAddress(payload)) return payload.trim();\n" +
            '    if(!payload) return null;\n' +
            '    if(Array.isArray(payload)){\n' +
            '      for(var i = 0; i < payload.length; i += 1){\n' +
            '        var nested = extractStacksAddress(payload[i], depth + 1);\n' +
            '        if(nested) return nested;\n' +
            '      }\n' +
            '      return null;\n' +
            '    }\n' +
            "    if(typeof payload !== 'object') return null;\n" +
            "    var keys = ['address','selectedAddress','identityAddress','stxAddress','addresses','accounts','result','profile','authResponsePayload','userData'];\n" +
            '    for(var k = 0; k < keys.length; k += 1){\n' +
            '      var key = keys[k];\n' +
            '      if(!(key in payload)) continue;\n' +
            '      var found = extractStacksAddress(payload[key], depth + 1);\n' +
            '      if(found) return found;\n' +
            '    }\n' +
            "    if(payload.mainnet && looksLikeStacksAddress(payload.mainnet)) return String(payload.mainnet).trim();\n" +
            "    if(payload.testnet && looksLikeStacksAddress(payload.testnet)) return String(payload.testnet).trim();\n" +
            '    return null;\n' +
            '  }\n' +
            '  function loadConnectModule(){\n' +
            '    if(connectModulePromise) return connectModulePromise;\n' +
            '    connectModulePromise = (async function(){\n' +
            '      var lastError = null;\n' +
            '      for(var i = 0; i < CONNECT_URLS.length; i += 1){\n' +
            '        var url = CONNECT_URLS[i];\n' +
            '        try{\n' +
            '          var mod = await import(url);\n' +
            '          if(mod && (typeof mod.showConnect === "function" || typeof mod.authenticate === "function")){\n' +
            '            debugLog("wallet sdk import succeeded", { url: url });\n' +
            '            return mod;\n' +
            '          }\n' +
            '        }catch(error){\n' +
            '          lastError = error;\n' +
            '          debugLog("wallet sdk import failed", { url: url, error: error && error.message ? error.message : String(error) });\n' +
            '        }\n' +
            '      }\n' +
            "      throw lastError || new Error('Failed to load wallet connect SDK.');\n" +
            '    })().catch(function(error){\n' +
            '      connectModulePromise = null;\n' +
            '      throw error;\n' +
            '    });\n' +
            '    return connectModulePromise;\n' +
            '  }\n' +
            '  function createUserSession(mod){\n' +
            '    if(!mod || typeof mod.AppConfig !== "function" || typeof mod.UserSession !== "function") return null;\n' +
            '    try{\n' +
            "      var appConfig = new mod.AppConfig(['store_write'], undefined, '', '/manifest.json');\n" +
            '      return new mod.UserSession({ appConfig: appConfig });\n' +
            '    }catch(error){\n' +
            '      return null;\n' +
            '    }\n' +
            '  }\n' +
            '  function resolveRedirectPath(){\n' +
            '    var path = String(window.location.pathname || "/") + String(window.location.search || "") + String(window.location.hash || "");\n' +
            "    return path || '/';\n" +
            '  }\n' +
            '  function buildSessionResponse(session){\n' +
            '    if(!session || !looksLikeStacksAddress(session.address)){\n' +
            '      return { addresses: [], accounts: [] };\n' +
            '    }\n' +
            '    var network = normalizeNetwork(session.network) || inferNetworkFromAddress(session.address) || TARGET_NETWORK;\n' +
            "    var stxAddress = network === 'mainnet' ? { mainnet: session.address } : { testnet: session.address };\n" +
            '    return {\n' +
            '      address: session.address,\n' +
            '      selectedAddress: session.address,\n' +
            '      identityAddress: session.address,\n' +
            '      addresses: [session.address],\n' +
            '      accounts: [session.address],\n' +
            '      stxAddress: stxAddress,\n' +
            '      network: network\n' +
            '    };\n' +
            '  }\n' +
            '  function parseRequestArgs(methodOrPayload, maybeParams){\n' +
            "    if(typeof methodOrPayload === 'string') return { method: methodOrPayload, params: maybeParams };\n" +
            "    if(methodOrPayload && typeof methodOrPayload === 'object') return { method: methodOrPayload.method, params: methodOrPayload.params };\n" +
            '    return { method: null, params: null };\n' +
            '  }\n' +
            '  function supportsShimMethod(method){\n' +
            "    return method === 'stx_getAddresses' || method === 'getAddresses' || method === 'stx_getAccounts' || method === 'getAccounts' || method === 'wallet_getAccount' || method === 'stx_getNetwork' || method === 'getNetwork' || method === 'stx_requestAccounts' || method === 'requestAccounts' || method === 'stx_connect' || method === 'connect' || method === 'wallet_connect' || method === 'stx_disconnect' || method === 'wallet_disconnect' || method === 'disconnect' || method === 'deactivate';\n" +
            '  }\n' +
            '  function collectRequestDelegate(root, originalRequest){\n' +
            "    if(!root || typeof root !== 'object') return null;\n" +
            '    var queue = [root];\n' +
            '    var seen = [];\n' +
            "    var keys = ['provider','walletProvider','wallet','StacksProvider','stacksProvider','stacks','rpc','client','providers'];\n" +
            '    while(queue.length){\n' +
            '      var current = queue.shift();\n' +
            "      if(!current || typeof current !== 'object') continue;\n" +
            '      if(seen.indexOf(current) >= 0) continue;\n' +
            '      seen.push(current);\n' +
            '      if(current !== root && typeof current.request === "function" && current.request !== originalRequest){\n' +
            '        return current.request.bind(current);\n' +
            '      }\n' +
            '      for(var i = 0; i < keys.length; i += 1){\n' +
            '        var nested = current[keys[i]];\n' +
            "        if(nested && typeof nested === 'object') queue.push(nested);\n" +
            '      }\n' +
            '    }\n' +
            '    return null;\n' +
            '  }\n' +
            '  function connectViaShim(provider){\n' +
            '    if(connectInFlight) return connectInFlight;\n' +
            '    connectInFlight = loadConnectModule().then(function(mod){\n' +
            '      return new Promise(function(resolve, reject){\n' +
            '        var settled = false;\n' +
            '        var userSession = createUserSession(mod);\n' +
            '        var showConnectFn = mod && typeof mod.showConnect === "function" ? mod.showConnect : null;\n' +
            '        var authenticateFn = mod && typeof mod.authenticate === "function" ? mod.authenticate : null;\n' +
            '        if(!showConnectFn && !authenticateFn){\n' +
            "          reject(new Error('Wallet connect SDK missing showConnect/authenticate.'));\n" +
            '          return;\n' +
            '        }\n' +
            '        var timeoutId = setTimeout(function(){\n' +
            '          if(settled) return;\n' +
            '          settled = true;\n' +
            '          reject(new Error("Wallet authentication timed out."));\n' +
            '        }, 90000);\n' +
            '        function finish(error, payload){\n' +
            '          if(settled) return;\n' +
            '          settled = true;\n' +
            '          clearTimeout(timeoutId);\n' +
            '          if(error){ reject(error); return; }\n' +
            '          var address = extractStacksAddress(payload, 0);\n' +
            '          var network = address ? (inferNetworkFromAddress(address) || TARGET_NETWORK) : TARGET_NETWORK;\n' +
            '          if(!address && payload && payload.userSession && typeof payload.userSession.loadUserData === "function"){\n' +
            '            try{\n' +
            '              var userData = payload.userSession.loadUserData();\n' +
            '              address = extractStacksAddress(userData, 0) || address;\n' +
            '              if(address){ network = inferNetworkFromAddress(address) || network; }\n' +
            '            }catch(innerError){}\n' +
            '          }\n' +
            '          if(!address && userSession && typeof userSession.isUserSignedIn === "function" && userSession.isUserSignedIn()){\n' +
            '            try{\n' +
            '              var signedData = userSession.loadUserData();\n' +
            '              address = extractStacksAddress(signedData, 0) || address;\n' +
            '              if(address){ network = inferNetworkFromAddress(address) || network; }\n' +
            '            }catch(innerError2){}\n' +
            '          }\n' +
            '          if(address){\n' +
            '            writeStoredSession({ address: address, network: network });\n' +
            '          }\n' +
            '          resolve(readStoredSession());\n' +
            '        }\n' +
            '        var options = {\n' +
            '          appDetails: { name: "Xtrata Runtime", icon: window.location.origin + "/favicon.ico" },\n' +
            '          manifestPath: "/manifest.json",\n' +
            '          redirectTo: resolveRedirectPath(),\n' +
            '          onFinish: function(payload){ finish(null, payload || null); },\n' +
            '          onCancel: function(){ finish(null, null); }\n' +
            '        };\n' +
            '        if(userSession){ options.userSession = userSession; }\n' +
            '        try{\n' +
            '          var invocation;\n' +
            '          if(showConnectFn){ invocation = showConnectFn(options); }\n' +
            '          else { invocation = authenticateFn(options, provider || undefined); }\n' +
            '          Promise.resolve(invocation).catch(function(error){ finish(error); });\n' +
            '        }catch(error){\n' +
            '          finish(error);\n' +
            '        }\n' +
            '      });\n' +
            '    }).finally(function(){\n' +
            '      connectInFlight = null;\n' +
            '    });\n' +
            '    return connectInFlight;\n' +
            '  }\n' +
            '  function shimRequestHandler(method, provider){\n' +
            '    var lower = String(method || "").trim();\n' +
            "    if(lower === 'stx_disconnect' || lower === 'wallet_disconnect' || lower === 'disconnect' || lower === 'deactivate'){\n" +
            '      writeStoredSession(null);\n' +
            '      return Promise.resolve({ ok: true });\n' +
            '    }\n' +
            "    if(lower === 'stx_requestAccounts' || lower === 'requestAccounts' || lower === 'stx_connect' || lower === 'connect' || lower === 'wallet_connect'){\n" +
            '      return connectViaShim(provider).then(function(session){ return buildSessionResponse(session); });\n' +
            '    }\n' +
            "    if(lower === 'stx_getAddresses' || lower === 'getAddresses' || lower === 'stx_getAccounts' || lower === 'getAccounts' || lower === 'wallet_getAccount'){\n" +
            '      return Promise.resolve(buildSessionResponse(readStoredSession()));\n' +
            '    }\n' +
            "    if(lower === 'stx_getNetwork' || lower === 'getNetwork'){\n" +
            "      return Promise.resolve({ network: (readStoredSession() || {}).network || TARGET_NETWORK });\n" +
            '    }\n' +
            '    var unsupported = new Error("Wallet method unsupported in runtime shim: " + lower);\n' +
            '    unsupported.code = -32601;\n' +
            '    return Promise.reject(unsupported);\n' +
            '  }\n' +
            '  function installProviderShim(provider, label){\n' +
            "    if(!provider || typeof provider !== 'object') return;\n" +
            '    if(provider.__xtrataRuntimeWalletPatched) return;\n' +
            "    var originalRequest = typeof provider.request === 'function' ? provider.request.bind(provider) : null;\n" +
            '    var delegatedRequest = collectRequestDelegate(provider, originalRequest);\n' +
            '    provider.request = function(methodOrPayload, maybeParams){\n' +
            '      var parsed = parseRequestArgs(methodOrPayload, maybeParams);\n' +
            '      var method = parsed.method;\n' +
            '      if(!method){\n' +
            '        var invalid = new Error("Wallet request requires a method.");\n' +
            '        invalid.code = -32600;\n' +
            '        return Promise.reject(invalid);\n' +
            '      }\n' +
            '      if(originalRequest){\n' +
            '        return Promise.resolve()\n' +
            '          .then(function(){ return originalRequest(methodOrPayload, maybeParams); })\n' +
            '          .catch(function(error){\n' +
            '            if(!isRequestNotImplementedError(error)) throw error;\n' +
            '            if(delegatedRequest){\n' +
            '              return Promise.resolve(delegatedRequest(methodOrPayload, maybeParams)).catch(function(delegateError){\n' +
            '                if(!isRequestNotImplementedError(delegateError)) throw delegateError;\n' +
            '                if(!supportsShimMethod(method)) throw delegateError;\n' +
            '                return shimRequestHandler(method, provider);\n' +
            '              });\n' +
            '            }\n' +
            '            if(!supportsShimMethod(method)) throw error;\n' +
            '            return shimRequestHandler(method, provider);\n' +
            '          });\n' +
            '      }\n' +
            '      if(delegatedRequest){\n' +
            '        return Promise.resolve(delegatedRequest(methodOrPayload, maybeParams)).catch(function(error){\n' +
            '          if(!isRequestNotImplementedError(error) || !supportsShimMethod(method)) throw error;\n' +
            '          return shimRequestHandler(method, provider);\n' +
            '        });\n' +
            '      }\n' +
            '      return shimRequestHandler(method, provider);\n' +
            '    };\n' +
            "    var methodAliases = ['stx_getAddresses','getAddresses','stx_getAccounts','getAccounts','wallet_getAccount','stx_getNetwork','getNetwork','stx_requestAccounts','requestAccounts','stx_connect','connect','wallet_connect','stx_disconnect','wallet_disconnect','disconnect','deactivate'];\n" +
            '    for(var i = 0; i < methodAliases.length; i += 1){\n' +
            '      (function(alias){\n' +
            '        if(typeof provider[alias] === "function") return;\n' +
            '        provider[alias] = function(params){ return provider.request(alias, params); };\n' +
            '      })(methodAliases[i]);\n' +
            '    }\n' +
            '    provider.__xtrataRuntimeWalletPatched = true;\n' +
            "    debugLog('provider shim installed', { provider: label || 'unknown' });\n" +
            '  }\n' +
            '  function installAllProviderShims(){\n' +
            '    var candidates = [\n' +
            "      { label: 'window.StacksProvider', provider: window.StacksProvider },\n" +
            "      { label: 'window.LeatherProvider', provider: window.LeatherProvider },\n" +
            "      { label: 'window.stacks', provider: window.stacks },\n" +
            "      { label: 'window.XverseProviders', provider: window.XverseProviders },\n" +
            "      { label: 'window.XverseProviders.StacksProvider', provider: window.XverseProviders && window.XverseProviders.StacksProvider },\n" +
            "      { label: 'window.xverseProviders', provider: window.xverseProviders },\n" +
            "      { label: 'window.xverseProviders.StacksProvider', provider: window.xverseProviders && window.xverseProviders.StacksProvider }\n" +
            '    ];\n' +
            '    for(var i = 0; i < candidates.length; i += 1){\n' +
            '      installProviderShim(candidates[i].provider, candidates[i].label);\n' +
            '    }\n' +
            '    if(window.StacksProvider && typeof window.StacksProvider === "object"){\n' +
            '      try{\n' +
            "        window.StacksProvider.__arcadeWalletLabel = window.StacksProvider.__arcadeWalletLabel || 'window.StacksProvider';\n" +
            '      }catch(error){}\n' +
            '    }\n' +
            '  }\n' +
            '  loadConnectModule().catch(function(error){\n' +
            "    debugLog('wallet sdk prewarm failed', { error: error && error.message ? error.message : String(error) });\n" +
            '  });\n' +
            '  installAllProviderShims();\n' +
            '  setTimeout(installAllProviderShims, 400);\n' +
            '  setTimeout(installAllProviderShims, 1400);\n' +
            '  setTimeout(installAllProviderShims, 3200);\n' +
            '  window.addEventListener("focus", function(){\n' +
            '    installAllProviderShims();\n' +
            '  });\n' +
            '})();<\\/script>'
          );
        }

        function injectRuntimeSupport(html, params) {
          var supportScript = buildRuntimeWalletSupportScript(params);
          if (!supportScript) {
            return html;
          }
          if (/<head[^>]*>/i.test(html)) {
            return html.replace(/<head[^>]*>/i, function (match) {
              return match + '\n' + supportScript;
            });
          }
          if (/<body[^>]*>/i.test(html)) {
            return html.replace(/<body[^>]*>/i, function (match) {
              return match + '\n' + supportScript;
            });
          }
          return supportScript + '\n' + html;
        }

        function launchHtml(html, contextLabel) {
          if (!html || !html.trim()) {
            throw new Error('Runtime content was empty (' + contextLabel + ').');
          }
          var htmlWithSupport = injectRuntimeSupport(html, params);
          document.open();
          document.write(htmlWithSupport);
          document.close();
        }

        var query = new URLSearchParams(window.location.search || '');
        var params = {
          contractId: query.get('contractId') || '',
          tokenId: query.get('tokenId') || '',
          network: query.get('network') || 'mainnet',
          fallbackContractId: query.get('fallbackContractId') || '',
          source: query.get('source') || ''
        };

        if (!params.contractId || !params.tokenId) {
          if (!params.source) {
            setError('Missing runtime parameters.', 'contractId/tokenId not provided');
            return;
          }
        }

        setStatus('Loading inscription content from runtime endpoint...');

        loadFromRuntimeEndpoint(params)
          .then(function (html) {
            launchHtml(html, 'runtime-endpoint');
          })
          .catch(function (runtimeError) {
            if (!params.source) {
              setError(
                'Runtime endpoint failed and no fallback source was provided.',
                runtimeError && runtimeError.message
                  ? runtimeError.message
                  : String(runtimeError)
              );
              return;
            }
            setStatus('Runtime endpoint failed, trying provided source URL...');
            loadFromSource(params.source)
              .then(function (html) {
                launchHtml(html, 'source-url');
              })
              .catch(function (sourceError) {
                var runtimeMessage =
                  runtimeError && runtimeError.message
                    ? runtimeError.message
                    : String(runtimeError);
                var sourceMessage =
                  sourceError && sourceError.message
                    ? sourceError.message
                    : String(sourceError);
                setError('Unable to load runtime content.', runtimeMessage + ' | ' + sourceMessage);
              });
          });
      })();
    </script>
  </body>
</html>
