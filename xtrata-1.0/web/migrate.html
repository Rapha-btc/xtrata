<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtrata — Migrate to v3</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #101010;
        color: #f4f1ea;
      }
      body { margin: 0; background: #101010; }
      main { width: min(900px, calc(100vw - 40px)); margin: 0 auto; padding: 28px 0 48px; }
      h1 { margin: 0 0 6px; font-size: 28px; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      p { color: #cfc8bc; line-height: 1.5; }
      code { color: #f7d36b; }
      .panel { border: 1px solid #34312d; border-radius: 8px; background: #181715; padding: 16px; margin: 14px 0; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      .hint { color: #aaa197; font-size: 13px; }
      select, button {
        border: 1px solid #5a5146; border-radius: 8px; background: #f4f1ea; color: #101010;
        padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer;
      }
      select { background: #0c0c0b; color: #f4f1ea; }
      button.secondary { background: transparent; color: #f4f1ea; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
      .tile { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #2b2926; border-radius: 8px; padding: 8px 10px; }
      .tile span { font-weight: 800; }
      .tile button { padding: 6px 10px; }
      pre { white-space: pre-wrap; word-break: break-word; background: #0c0c0b; border: 1px solid #2b2926; border-radius: 8px; padding: 12px; max-height: 320px; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Migrate inscriptions to v3</h1>
      <p>
        Connect the Xverse wallet that holds your legacy inscriptions. Scan a
        source core, then migrate each token into
        <code>SP3JNSEXAZP4BDSHV0DN3M8R3P0MY0EEBQQZX743X.xtrata-v3-2-3</code> by
        signing in Xverse. It never asks for a seed phrase.
      </p>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/migrate-ui.ts"></script>
  </body>
</html>
