<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtrata v3.2.1 Mainnet Handover</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101010;
        color: #f4f1ea;
      }
      body {
        margin: 0;
        background: #101010;
      }
      main {
        width: min(1180px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 32px;
        letter-spacing: 0;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
        letter-spacing: 0;
      }
      p {
        color: #cfc8bc;
        line-height: 1.55;
      }
      code {
        color: #f7d36b;
      }
      .toolbar,
      .panel {
        border: 1px solid #34312d;
        border-radius: 8px;
        background: #181715;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        margin: 22px 0;
      }
      .panel {
        padding: 18px;
        margin: 14px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }
      .kv {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px 14px;
        font-size: 14px;
      }
      .kv dt {
        color: #9f978b;
      }
      .kv dd {
        margin: 0;
        word-break: break-word;
      }
      button {
        border: 1px solid #5a5146;
        border-radius: 8px;
        background: #f4f1ea;
        color: #101010;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #f4f1ea;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .step {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-top: 1px solid #2b2926;
      }
      .step:first-child {
        border-top: 0;
      }
      .step-title {
        font-weight: 800;
      }
      .step-note {
        color: #aaa197;
        font-size: 13px;
        margin-top: 4px;
      }
      .status {
        color: #98e19d;
        font-size: 13px;
        margin-top: 6px;
      }
      .warn {
        color: #f7d36b;
      }
      .fail {
        color: #ff8c7a;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0c0c0b;
        border: 1px solid #2b2926;
        border-radius: 8px;
        padding: 12px;
        max-height: 300px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Xtrata v3.2.1 Mainnet Handover</h1>
      <p>
        Use this page only with the Xverse wallet that controls
        <code>SP3JNSEXAZP4BDSHV0DN3M8R3P0MY0EEBQQZX743X</code>. It never asks
        for a seed phrase or private key.
      </p>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/mainnet-v3.2.1-handover.ts"></script>
  </body>
</html>
