[project]
name = "xboard-v1"
description = "Xboard v1 Clarity contract and Clarinet test suite"
authors = ["Xboard"]
telemetry = false
cache_dir = ".cache"
requirements = []

[contracts.xboard-v1]
path = "contracts/xboard-v1.clar"
clarity_version = 2
epoch = 2.5

[contracts.xboard-v1-proxy]
path = "contracts/xboard-v1-proxy.clar"
clarity_version = 2
epoch = 2.5
depends_on = ["xboard-v1"]

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
